name: Install original flyer

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-original-flyer.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Mateja's original flyer
        env:
          FLYER_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-4b3c-8243-a659-85c9266b0b56/raw?se=2026-10-12T10%3A22%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=10dab85c-6014-570c-9f75-0e395a7e4c9f&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T06%3A31%3A01Z&ske=2026-10-13T06%3A31%3A01Z&sks=b&skv=2026-02-06&sig=aumboqhz4H5OLGOZd4t9aMrJf%2BYwr9uV23SVa53E3WU%3D'
        run: |
          curl -fL --retry 3 "$FLYER_URL" -o mateja-flyer.png
          file mateja-flyer.png
          test "$(wc -c < mateja-flyer.png)" -gt 1000000
          file mateja-flyer.png | grep -q "PNG image data"

      - name: Point the page to the full-quality flyer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s2, n = re.subn(
              r'(<img class="flyer-img" src=")[^"]+(")',
              r'\1mateja-flyer.png?v=6\2',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not find flyer image tag")
          p.write_text(s2, encoding="utf-8")
          PY
          git rm -f mateja-flyer.jpg || true

      - name: Commit full-quality flyer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mateja-flyer.png
          git commit -m "Use full-quality original Mateja flyer"
          git push
