services:
  scan-api:
    ports: []

  caddy:
    image: caddy:2-alpine
    container_name: kuzki-scan-caddy
    restart: unless-stopped
    depends_on:
      scan-api:
        condition: service_healthy
    environment:
      SCAN_DOMAIN: ${SCAN_DOMAIN:-scan.kuski.qd.je}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
