services:
  scan-api:
    build: .
    container_name: kuzki-scan
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/scans.db
    volumes:
      - scan-data:/data
    ports:
      - "8787:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  scan-data:
