<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Kontakt za sprehajanje kužkov. Pokliči, pošlji SMS, piši prek WhatsAppa, Viberja ali e-pošte.">
  <meta property="og:title" content="Sprehajanje kužkov | Kontakt">
  <meta property="og:description" content="Dogovor za sprehajanje kužkov. Stopimo v stik.">
  <meta property="og:type" content="website">
  <title>Kontakt | Sprehajanje kužkov</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f5f0;
      --card: #fffefa;
      --text: #20332a;
      --muted: #68796e;
      --green: #244938;
      --green-deep: #173827;
      --green-soft: #ecf3eb;
      --line: #e5e7de;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100dvh; color: var(--text); font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 6% 4%, #e9f0e4 0%, transparent 34%),
                  radial-gradient(ellipse at 97% 100%, #f0e9d9 0%, transparent 32%),
                  var(--page);
    }
    a, button { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #8ebc8e; outline-offset: 3px; }
    .site-shell { width: min(100% - 32px, 600px); margin: 0 auto; padding: 22px 0 32px; }
    .contact-card {
      display: flex; flex-direction: column;
      border: 1px solid var(--line); border-radius: 26px; overflow: hidden;
      background: var(--card);
      box-shadow: 0 20px 65px #29413012, 0 2px 8px #29413008;
    }
    .flyer-panel {
      display: flex; justify-content: center;
      padding: 20px; background: linear-gradient(160deg, #eaf0e7, #f1ede4);
      border-bottom: 1px solid var(--line); min-width: 0;
    }
    .flyer-frame {
      width: 100%; max-width: 520px;
      margin: 0; padding: 8px; border-radius: 18px; background: #fffefa;
      border: 1px solid #d9e0d5; box-shadow: 0 12px 30px #20382916;
    }
    .flyer-img { display: block; width: 100%; height: auto; border-radius: 11px; }
    .contact-panel { min-width: 0; padding: clamp(25px, 5vw, 40px); }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px;
      color: #416f50; font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1.75px;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #76ad78; }
    h1 { margin: 0; font-size: clamp(35px, 4vw, 44px); line-height: 1.11; font-weight: 770; letter-spacing: -1.8px; color: #1e3428; }
    .intro { margin: 15px 0 27px; font-size: 15px; line-height: 1.65; color: var(--muted); max-width: 36ch; }
    .section-label { margin: 0 0 12px; font-size: 12px; font-weight: 760; letter-spacing: .75px; text-transform: uppercase; color: #748476; }
    .contact-links { display: grid; gap: 11px; }
    .contact-action {
      display: flex; align-items: center; gap: 12px; min-width: 0;
      min-height: 60px; text-decoration: none; color: var(--text);
      border-radius: 16px; border: 1px solid var(--line);
      background: white; padding: 11px 14px; font-size: 15px; font-weight: 720;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .contact-action:hover { border-color: #cdd9ca; background: #fbfefa; transform: translateY(-1px); box-shadow: 0 5px 14px #2c4a3210; }
    .contact-action:active { transform: translateY(0); }
    .contact-action .icon-wrap {
      flex: none; display: grid; place-items: center; width: 38px; height: 38px;
      background: #f2f4ef; border-radius: 11px; color: #405d49;
    }
    .line-mark, .brand-mark { display: block; width: 21px; height: 21px; }
    .action-label { flex: 1; min-width: 0; }
    .action-arrow { width: 17px; height: 17px; flex: none; color: #809184; }
    .contact-action.primary {
      min-height: 73px; border-color: var(--green); color: #fff;
      background: linear-gradient(125deg, var(--green), var(--green-deep));
      box-shadow: 0 7px 16px #23483220;
    }
    .contact-action.primary:hover { background: var(--green-deep); border-color: var(--green-deep); }
    .contact-action.primary .icon-wrap { width: 43px; height: 43px; background: #ffffff24; color: #fff; }
    .contact-action.primary .line-mark { width: 23px; height: 23px; }
    .contact-action.primary .action-arrow { color: #cddfd0; }
    .contact-action.primary .action-sub { display: block; margin-top: 3px; font-size: 13px; color: #cfe0d3; font-weight: 520; }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .action-grid .contact-action { padding: 11px 12px; gap: 10px; font-size: 14px; min-height: 58px; }
    .action-grid .icon-wrap { width: 34px; height: 34px; border-radius: 10px; }
    .icon-wrap.whatsapp { background: #e7f9eb; color: #169b49; }
    .icon-wrap.viber { background: #f0ebff; color: #7360b5; }
    .icon-wrap.mail { background: #f2f1e9; color: #6b7053; }
    .icon-wrap.sms { background: #ebf1fc; color: #4476ac; }
    .contact-footer { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
    .share-action {
      display: flex; gap: 10px; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; border: 1px solid #dbe5da;
      background: var(--green-soft); border-radius: 13px; color: #2e5a3c;
      font-size: 14px; font-weight: 740; transition: background .15s ease;
    }
    .share-action:hover { background: #e2ece0; }
    .share-action svg { width: 18px; height: 18px; }
    #shareStatus { min-height: 19px; margin: 7px 0 0; text-align: center; font-size: 12px; color: #517158; }
    .privacy-options { border-top: 1px solid var(--line); margin-top: 15px; padding-top: 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }
    .privacy-choice { margin: 4px 5px 0 0; border: 1px solid var(--line); border-radius: 9px; background: white; padding: 7px 9px; font-size: 12px; }
    .page-note { margin: 18px 0 0; text-align: center; color: #849082; font-size: 12px; }
    @media (max-width: 760px) {
      .site-shell { width: min(100% - 24px, 520px); padding: 12px 0 24px; }
      .contact-card { border-radius: 23px; }
      .contact-panel { padding: 27px 23px 25px; }
      .flyer-panel { padding: 12px; }
      .flyer-frame { max-width: 470px; padding: 6px; }
      h1 { font-size: clamp(33px, 8vw, 41px); }
      .intro { margin-bottom: 23px; }
    }
    @media (max-width: 360px) {
      .contact-panel { padding: 24px 16px; }
      .action-grid { gap: 7px; }
      .action-grid .contact-action { gap: 7px; padding: 10px 8px; font-size: 13px; }
      .action-grid .icon-wrap { width: 30px; height: 30px; }
      .action-grid .line-mark, .action-grid .brand-mark { width: 19px; height: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .contact-action, .share-action { transition: none; }
      .contact-action:hover { transform: none; }
    }
  </style>
  <script src="app.js?v=2" defer></script>
</head>
