<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Sprehajanje kužkov – kontakt za dogovor o sprehodu. Piši na WhatsApp, pokliči ali pošlji sporočilo.">
  <meta property="og:title" content="Sprehajanje kužkov | Kontakt">
  <meta property="og:description" content="Za dogovor o sprehodu kužka mi piši na WhatsApp.">
  <meta property="og:type" content="website">
  <title>Kontakt | Sprehajanje kužkov</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --paper: #fff;
      --ink: #252c27;
      --muted: #636b64;
      --border: #e1e4dc;
      --whatsapp: #188451;
      --whatsapp-hover: #126f42;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #78b28a; outline-offset: 3px; }
    .site-shell {
      width: min(100% - 28px, 560px);
      margin: 0 auto;
      padding: 18px 0 34px;
    }
    .contact-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .flyer-panel {
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .flyer-frame { margin: 0; }
    .flyer-img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .contact-panel { padding: 27px 25px 25px; }
    h1 {
      margin: 0 0 9px;
      font-size: clamp(24px, 5.5vw, 29px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.6px;
    }
    .intro {
      margin: 0 0 22px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
    }
    .contact-links { display: grid; gap: 10px; }
    .contact-action {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
      min-height: 57px;
      padding: 11px 13px;
      text-decoration: none;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: background .15s ease, border-color .15s ease;
    }
    .contact-action:hover { background: #f8faf7; border-color: #bfcac0; }
    .contact-action:active { background: #f1f5ef; }
    .icon-wrap {
      display: grid;
      flex: 0 0 27px;
      place-items: center;
      color: #536457;
    }
    .line-mark, .brand-mark { width: 23px; height: 23px; display: block; }
    .action-label { min-width: 0; flex: 1; }
    .contact-action.primary {
      min-height: 77px;
      padding: 13px 17px;
      background: var(--whatsapp);
      border-color: var(--whatsapp);
      color: #fff;
      font-size: 17px;
      font-weight: 720;
      border-radius: 11px;
    }
    .contact-action.primary:hover { background: var(--whatsapp-hover); border-color: var(--whatsapp-hover); }
    .contact-action.primary:active { background: #10663c; }
    .contact-action.primary .icon-wrap { flex-basis: 35px; color: #fff; }
    .contact-action.primary .brand-mark { width: 32px; height: 32px; }
    .action-sub {
      display: block;
      font-size: 12px;
      font-weight: 450;
      margin-top: 4px;
      color: #e1f7e9;
      line-height: 1.3;
    }
    .other-label {
      margin: 14px 0 1px;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 500;
      color: var(--muted);
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .action-grid .contact-action { gap: 8px; min-height: 53px; padding: 10px 12px; }
    .action-grid .icon-wrap { flex-basis: 25px; }
    .action-grid .brand-mark, .action-grid .line-mark { width: 21px; height: 21px; }
    .contact-footer { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); }
    .share-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: #59645b;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
    }
    .share-action:hover { background: #f4f6f3; }
    .share-action .line-mark { width: 17px; height: 17px; }
    #shareStatus { margin: 0; min-height: 15px; text-align: center; font-size: 12px; color: var(--muted); }
    /* Only used if voluntary device analytics are enabled in app.js. */
    .privacy-options { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; font-size: 12px; line-height: 1.5; }
    .privacy-choice { margin: 4px 6px 0 0; border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 7px; }
    @media (max-width: 430px) {
      .site-shell { width: 100%; padding: 0 0 20px; }
      .contact-card { border-radius: 0; border-left: 0; border-right: 0; }
      .flyer-panel { padding: 8px; }
      .contact-panel { padding: 25px 19px; }
    }
    @media (max-width: 340px) {
      .action-grid .contact-action { font-size: 13px; padding: 9px; }
      .action-grid .icon-wrap { flex-basis: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .contact-action { transition: none; }
    }
  </style>
  <script src="app.js?v=4" defer></script>
</head>
