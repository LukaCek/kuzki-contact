<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>Kontakt | Sprehajanje kužkov</title>
  <meta name="description" content="Kontakt za sprehajanje kužkov.">
  <style>
    :root{
      --bg:#f4f1ea;
      --card:#fffefa;
      --text:#1e2924;
      --muted:#69736e;
      --line:#ddd9d0;
      --button:#1f3029;
      --button-hover:#15231d;
      --soft:#efebe3;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:22px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{
      width:min(100%,420px);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      padding:30px 22px 22px;
      box-shadow:0 18px 60px rgba(31,48,41,.08);
    }
    .flyer-wrap{margin:0 0 22px}
    .flyer-img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line)}
    .top{text-align:center;padding:2px 10px 24px}
    .paw{
      width:54px;height:54px;
      margin:0 auto 15px;
      border-radius:17px;
      background:var(--soft);
      display:grid;
      place-items:center;
    }
    .paw svg{width:28px;height:28px}
    h1{
      margin:0;
      font-size:30px;
      line-height:1.08;
      letter-spacing:-.7px;
      font-weight:800;
    }
    .buttons{display:grid;gap:10px}
    .action{
      min-height:56px;
      display:flex;
      align-items:center;
      gap:14px;
      width:100%;
      border:1px solid var(--line);
      border-radius:16px;
      padding:0 17px;
      background:#fff;
      color:var(--text);
      text-decoration:none;
      font:inherit;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      text-align:left;
      transition:transform .08s ease,background .12s ease,border-color .12s ease;
    }
    .action:hover{background:#faf9f5;border-color:#cbc6bc}
    .action:active{transform:scale(.985)}
    .action.primary{background:var(--button);border-color:var(--button);color:#fff}
    .action.primary:hover{background:var(--button-hover);border-color:var(--button-hover)}
    .action svg{width:22px;height:22px;flex:0 0 22px}
    .action .label{flex:1}
    .action.disabled{
      opacity:.42;
      cursor:not-allowed;
      pointer-events:none;
    }
    .divider{
      height:1px;
      background:var(--line);
      margin:4px 0;
    }
    #shareStatus{
      min-height:18px;
      margin:11px 4px 0;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
  </style>
</head>

</main>

<script>
  // Vpiši številko v mednarodni obliki, npr. +38640123456.
  // Dokler je prazna, so telefonski gumbi varno onemogočeni.
  const PHONE_E164 = "+38670337710";

  function enablePhoneLinks() {
    const normalized = PHONE_E164.trim();
    if (!normalized) return;

    const digits = normalized.replace(/\D/g, "");
    const encoded = encodeURIComponent(normalized);

    const links = {
      callBtn: "tel:" + normalized,
      smsBtn: "sms:" + normalized,
      whatsappBtn: "https://wa.me/" + digits,
      viberBtn: "viber://chat?number=" + encoded
    };

    Object.entries(links).forEach(([id, href]) => {
      const el = document.getElementById(id);
      el.href = href;
      el.classList.remove("disabled");
      el.removeAttribute("aria-disabled");
    });
  }

  enablePhoneLinks();

  const shareBtn = document.getElementById("shareBtn");
  const shareStatus = document.getElementById("shareStatus");

  shareBtn.addEventListener("click", async () => {
    const data = {
      title: "Kontakt",
      url: window.location.href
    };

    try {
      if (navigator.share) {
        await navigator.share(data);
      } else {
        await navigator.clipboard.writeText(window.location.href);
        shareStatus.textContent = "Povezava kopirana.";
        setTimeout(() => shareStatus.textContent = "", 2200);
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
      shareStatus.textContent = "Povezave ni bilo mogoče deliti.";
      setTimeout(() => shareStatus.textContent = "", 2200);
    }
  });
</script>
